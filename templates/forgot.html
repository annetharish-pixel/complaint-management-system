<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GNIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="box">

    <img src="{{ url_for('static', filename='gnit_campus.png') }}" alt="GNIT Campus" style="width: 100%; height: 130px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; border: 2px solid #e2e8f0;">

    <h2 class="gnit-blue-title" style="margin-top:0;">Reset Password</h2>

    {% if error %}
    <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="success-msg">
        ✅ Password updated successfully!
    </div>
    <br>
    <a href="/login"><button>🔑 Back to Login</button></a>
    {% else %}

    <form method="POST">
        <input type="email" name="email" placeholder="Enter Registered Email" required><br>
        <input type="password" name="new_password" placeholder="Enter New Password" required><br>
        <input type="password" name="confirm_password" placeholder="Confirm New Password" required><br><br>
        <button type="submit">Reset Password</button>
    </form>

    <br>
    <p>Remembered your password? <a href="/login" style="color:#007BFF; font-weight:600;">Login Here</a></p>
    <a href="/"><button style="background:#6c757d; width:200px; padding:8px;">⬅ Home</button></a>
    {% endif %}

</div>

</body>
</html>
