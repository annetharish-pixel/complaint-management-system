<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            font-size: 14px;
        }

        th {
            background: #007BFF;
            color: white;
        }
    </style>
</head>
<body>

<div class="box">

    <img src="{{ url_for('static', filename='gnit_campus.png') }}" alt="GNIT Campus" style="width: 100%; height: 140px; object-fit: cover; border-radius: 14px; margin-bottom: 15px; border: 2px solid #e2e8f0;">

    <h2 class="gnit-blue-title" style="margin-top:0;">Track Complaint</h2>

<form method="POST">

<input type="text"
name="complaint_id"
placeholder="Enter Complaint ID (Example: CMP123456)"
required>

<br><br>

<button type="submit">Track</button>

</form>

{% if result %}

<table>

<tr>
<th>Complaint ID</th>
<td>{{ result[1] }}</td>
</tr>

<tr>
<th>Name</th>
<td>{{ result[2] }}</td>
</tr>

<tr>
<th>Department</th>
<td>{{ result[3] }}</td>
</tr>

<tr>
<th>Complaint</th>
<td>{{ result[4] }}</td>
</tr>

<tr>
<th>Status</th>
<td>{{ result[5] }}</td>
</tr>

</table>

{% elif request.method=="POST" %}

<h3 style="color:red;">Complaint ID Not Found!</h3>

{% endif %}

    <br><br>
    <a href="/"><button style="background:#6c757d; width:200px; padding:8px;">⬅ Home</button></a>

</div>

</body>
</html>
