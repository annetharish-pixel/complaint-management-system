<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="box">

    <img src="{{ url_for('static', filename='gnit_logo_banner.png') }}" alt="GNIT Logo Banner" style="width: 100%; max-height: 65px; object-fit: contain; margin-bottom: 10px;">
    <img src="{{ url_for('static', filename='gnit_campus.png') }}" alt="GNIT Campus" style="width: 100%; height: 110px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0;">

    <h2 class="gnit-blue-title" style="margin-top:0;">User Login</h2>

    {% if message %}
    <div class="success-msg">✅ {{ message }}</div>
    {% endif %}

    {% if error %}
    <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="email" name="email" placeholder="Enter Email" required><br>
        <input type="password" name="password" placeholder="Enter Password" required><br><br>
        <button type="submit">Login</button>
    </form>

    <br>
    <p style="margin: 5px 0;"><a href="/forgot" style="color:#007BFF; font-size:14px; font-weight:600; text-decoration: underline;">🔑 Forgot Password?</a></p>
    <p style="margin: 5px 0;">Don't have an account? <a href="/register" style="color:#007BFF; font-weight:600;">Register Here</a></p>
    <br>
    <a href="/"><button style="background:#6c757d; width:200px; padding:8px;">⬅ Home</button></a>

</div>

</body>
</html>
