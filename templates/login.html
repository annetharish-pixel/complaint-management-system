<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .box{
            width:350px;
            margin:80px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            background:#007BFF;
            color:white;
            padding:10px 20px;
            border:none;
            cursor:pointer;
        }

        a{
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="box">

<h2>User Login</h2>

<form method="POST">

<input type="email" name="email" placeholder="Enter Email" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<br>

Don't have an account?

<a href="/register">Register Here</a>

</div>

</body>
</html>
