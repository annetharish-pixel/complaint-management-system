<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <img src="{{ url_for('static', filename='gnit_campus.png') }}" alt="GNIT Campus" style="width: 100%; height: 140px; object-fit: cover; border-radius: 14px; margin-bottom: 15px; border: 2px solid #e2e8f0;">
    <h1 class="gnit-blue-title" style="margin-top:0;">Submit Complaint</h1>

    {% if success %}
    <div class="success-msg">
        <h3 style="margin-top:0;">✅ Complaint Submitted!</h3>
        <p style="margin: 5px 0;">Your Complaint ID:</p>
        <h2 style="color: #007BFF; letter-spacing: 1px; margin: 5px 0;">{{ complaint_id }}</h2>
        <p style="font-size: 13px; color: #555;">Please save this ID to track your complaint status.</p>
    </div>
    <br>
    <a href="/"><button>🏠 Go to Home</button></a>
    {% else %}

    <form method="POST">
        <input type="text" name="name" placeholder="Enter Your Name" required><br>
        <input type="text" name="department" placeholder="Department" required><br>
        <textarea name="complaint" placeholder="Write your complaint" rows="4" required></textarea><br>
        <button type="submit">Submit Complaint</button>
    </form>
    <br><br>
    <a href="/"><button style="background:#6c757d;">⬅ Back to Home</button></a>
    {% endif %}

</div>

</body>
</html>
