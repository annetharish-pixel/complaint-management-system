<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        h1{
            text-align:center;
        }

        .container{
            width:80%;
            margin:auto;
            display:flex;
            justify-content:space-around;
            margin-top:40px;
        }

        .card{
            width:220px;
            padding:20px;
            border-radius:10px;
            background:white;
            text-align:center;
            box-shadow:0 0 10px gray;
        }

        .card h2{
            color:#007BFF;
        }

        a{
            text-decoration:none;
        }

        button{
            padding:10px 20px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h1>📊 GNIT Admin Dashboard</h1>

<div class="container">

<div class="card">
<h2>{{ total }}</h2>
<p>Total Complaints</p>
</div>

<div class="card">
<h2>{{ pending }}</h2>
<p>Pending</p>
</div>

<div class="card">
<h2>{{ resolved }}</h2>
<p>Resolved</p>
</div>

</div>

<br><br>

<center>

<a href="/complaints">
<button>View Complaints</button>
</a>

&nbsp;&nbsp;

<a href="/logout">
<button>Logout</button>
</a>

</center>

</body>
</html>
